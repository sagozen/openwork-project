[project]
name = "bds"
version = "0.1.0"
description = "Bản đồ số: gợi ý địa chỉ, phân giải địa chỉ, khoảng cách thực tế"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "osmium>=4.3.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sklearn-crfsuite>=0.5.0",
    "uvicorn[standard]>=0.54.0",
    "vietnamadminunits>=1.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/bds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: cần PostGIS/Valhalla đang chạy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "googlemaps>=4.10.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.isort]
known-first-party = ["bds"]
