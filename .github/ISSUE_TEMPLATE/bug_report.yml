name: Bug report
description: Something does not work as the README says it should.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form: follow SECURITY.md instead.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - apps/imagefactory
        - apps/myartifacts
        - apps/ota
        - apps/transcript
        - packages (shared platform)
        - services/transcriber
        - projects/mytutorlms
        - projects/chatqa
        - projects/astra-cms
        - projects/open-lims
        - projects/asia-maps-twins
        - Repository (docs, scripts, tooling)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks, starting from a fresh clone if you can.
      placeholder: |
        1. npm install
        2. npm run dev:imagefactory
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the error. Remove any secrets, tokens or personal data first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 24.21, commit abc1234"
    validations:
      required: true
