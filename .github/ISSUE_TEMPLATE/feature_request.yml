name: Feature request
description: Suggest an improvement or a new capability for one of the projects.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - apps/imagefactory
        - apps/myartifacts
        - apps/ota
        - apps/transcript
        - packages (shared platform)
        - services/transcriber
        - projects/mytutorlms
        - projects/chatqa
        - projects/astra-cms
        - projects/open-lims
        - projects/asia-maps-twins
        - Repository (docs, scripts, tooling)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Rough ideas are fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
